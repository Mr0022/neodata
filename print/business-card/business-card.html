<!DOCTYPE html>

<head>

<title>NeoData business card · Mehran Afshar, Founder &amp; CEO</title>
<!--
  NeoData business card — Mehran Afshar
  Trim size 85 × 55 mm, with 3 mm bleed on every side (each page is 91 × 61 mm).
  Keep text inside the safe area (.safe): 3 mm bleed + 4.5 mm from the trim edge.
  Page 1: front (name and contact details) · Page 2: back (logo on blue).
  Export: print to PDF with "Background graphics" on and no margins, or use the PDF next to this file.
-->
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;600;700;800&display=swap" rel="stylesheet" />
<style>
  @page { size: 91mm 61mm; margin: 0; }

  :root {
    --blue: #2D3BE8;          /* NeoData brand blue (logo/4.svg) */
    --blue-tint: #EEF0FD;     /* the brand mark as a faint pattern */
    --ink: #0F1A3D;
    --ink-soft: #46516D;
    --paper: #FFFFFF;
    --bleed: 3mm;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: #E9ECF3; }
  body {
    font-family: Manrope, "Segoe UI", system-ui, sans-serif;
    color: var(--ink);
    -webkit-print-color-adjust: exact; print-color-adjust: exact;
    -webkit-font-smoothing: antialiased;
  }

  /* on screen: both sides, one under the other; in print: one side per page */
  .sheet { display: grid; gap: 10mm; justify-content: center; padding: 10mm; }
  @media print {
    html, body { background: none; }
    .sheet { display: block; padding: 0; }
  }

  .card {
    position: relative; overflow: hidden;
    width: 91mm; height: 61mm;          /* trim size + bleed */
    background: var(--paper);
    break-after: page;
  }
  .card:last-child { break-after: auto; }
  .safe { position: absolute; inset: calc(var(--bleed) + 4.5mm); }

  /* ---------- front ---------- */

  /* the logo mark, large and faint, standing on the blue bottom edge */
  .card--front .pattern {
    position: absolute; right: calc(var(--bleed) + 4.5mm); bottom: calc(var(--bleed) + 1.6mm);
    height: 34mm; width: 34mm; fill: var(--blue-tint);
  }
  .card--front .brand { display: flex; flex-direction: column; align-items: flex-start; gap: 1.8mm; }
  .card--front .brand .logo { height: 7mm; width: auto; display: block; }
  .card--front .tag { font-size: 6.3pt; font-weight: 600; letter-spacing: .01em; line-height: 1; color: var(--ink-soft); }
  .card--front .person { position: absolute; left: 0; bottom: 0; }
  .card--front .name {
    margin: 0; font-size: 14.5pt; font-weight: 800; letter-spacing: -.01em; line-height: 1.1;
  }
  .card--front .role {
    margin: 1.3mm 0 0; font-size: 7.6pt; font-weight: 700; letter-spacing: .02em; line-height: 1;
    color: var(--blue);
  }
  .card--front .rule { width: 9mm; height: .7mm; margin: 2.6mm 0 3mm; border-radius: .4mm; background: var(--blue); }
  .card--front .contact { margin: 0; padding: 0; list-style: none; display: grid; gap: 1.3mm; }
  .card--front .contact li {
    display: flex; align-items: center; gap: 1.8mm;
    font-size: 7.2pt; font-weight: 600; line-height: 1; color: var(--ink-soft);
  }
  .card--front .contact svg {
    width: 2.9mm; height: 2.9mm; flex: none;
    fill: none; stroke: var(--blue); stroke-width: 2; stroke-linecap: round; stroke-linejoin: round;
  }
  /* thin blue edge at the bottom ties the front to the blue back */
  .card--front .edge {
    position: absolute; left: 0; right: 0; bottom: 0;
    height: calc(var(--bleed) + 1.6mm); background: var(--blue);
  }

  /* ---------- back: just the logo on brand blue ---------- */

  .card--back { background: var(--blue); display: grid; place-items: center; }
  .card--back .logo { height: 25mm; width: auto; display: block; }
</style>
</head>
